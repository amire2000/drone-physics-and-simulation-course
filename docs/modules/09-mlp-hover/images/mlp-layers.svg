<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">A small MLP maps two inputs to one output</title>
  <desc id="desc">Two input nodes connect through four representative hidden nodes to one desired vertical acceleration output node.</desc>
  <rect width="900" height="420" rx="20" fill="#f8fafc"/>
  <text x="45" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">A small network is a chain of weighted calculations</text>
  <g stroke="#94a3b8" stroke-width="2"><path d="M220 145 L420 105 M220 145 L420 180 M220 145 L420 255 M220 145 L420 330 M220 275 L420 105 M220 275 L420 180 M220 275 L420 255 M220 275 L420 330 M470 105 L680 215 M470 180 L680 215 M470 255 L680 215 M470 330 L680 215"/></g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="4"><circle cx="185" cy="145" r="38"/><circle cx="185" cy="275" r="38"/></g>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="4"><circle cx="445" cy="105" r="28"/><circle cx="445" cy="180" r="28"/><circle cx="445" cy="255" r="28"/><circle cx="445" cy="330" r="28"/></g>
  <circle cx="720" cy="215" r="48" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
  <text x="85" y="89" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Inputs</text>
  <text x="372" y="70" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Hidden layer</text>
  <text x="660" y="130" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Output</text>
  <text x="128" y="151" font-family="sans-serif" font-size="18" fill="#1e3a8a">error</text><text x="115" y="281" font-family="sans-serif" font-size="18" fill="#1e3a8a">velocity</text>
  <text x="397" y="382" font-family="sans-serif" font-size="17" fill="#166534">8 neurons</text><text x="392" y="403" font-family="sans-serif" font-size="15" fill="#475569">4 shown here</text>
  <text x="687" y="211" font-family="sans-serif" font-size="16" font-weight="700" fill="#9a3412">desired</text><text x="685" y="233" font-family="sans-serif" font-size="16" font-weight="700" fill="#9a3412">acceleration</text>
</svg>
