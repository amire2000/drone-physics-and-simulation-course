<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Why one straight line cannot classify a circle</title>
  <desc id="desc">The left panel shows a straight line that cannot keep all inside points together. The right panel shows a curved boundary an MLP can learn.</desc>
  <rect width="900" height="360" rx="20" fill="#f8fafc"/>
  <text x="45" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">Why a hidden layer helps: a circle needs a curved boundary</text>
  <g transform="translate(60 90)">
    <rect width="335" height="220" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="167" y="32" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#9a3412">One linear rule</text>
    <circle cx="167" cy="130" r="68" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 5"/>
    <line x1="27" y1="180" x2="305" y2="72" stroke="#dc2626" stroke-width="5"/>
    <circle cx="148" cy="112" r="8" fill="#ea580c"/><circle cx="190" cy="145" r="8" fill="#ea580c"/><circle cx="170" cy="164" r="8" fill="#ea580c"/>
    <circle cx="80" cy="78" r="8" fill="#2563eb"/><circle cx="266" cy="88" r="8" fill="#2563eb"/><circle cx="88" cy="190" r="8" fill="#2563eb"/><circle cx="265" cy="185" r="8" fill="#2563eb"/>
    <text x="167" y="207" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9a3412">a line splits the circle badly</text>
  </g>
  <g transform="translate(505 90)">
    <rect width="335" height="220" rx="16" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <text x="167" y="32" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#166534">MLP with a hidden layer</text>
    <circle cx="167" cy="130" r="68" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <circle cx="148" cy="112" r="8" fill="#ea580c"/><circle cx="190" cy="145" r="8" fill="#ea580c"/><circle cx="170" cy="164" r="8" fill="#ea580c"/>
    <circle cx="80" cy="78" r="8" fill="#2563eb"/><circle cx="266" cy="88" r="8" fill="#2563eb"/><circle cx="88" cy="190" r="8" fill="#2563eb"/><circle cx="265" cy="185" r="8" fill="#2563eb"/>
    <text x="167" y="207" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#166534">a curved boundary can surround it</text>
  </g>
  <circle cx="423" cy="330" r="7" fill="#ea580c"/><text x="437" y="336" font-family="sans-serif" font-size="16" fill="#475569">inside = 1</text><circle cx="560" cy="330" r="7" fill="#2563eb"/><text x="574" y="336" font-family="sans-serif" font-size="16" fill="#475569">outside = 0</text>
</svg>
