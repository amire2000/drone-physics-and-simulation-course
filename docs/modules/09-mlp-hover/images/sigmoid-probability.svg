<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">The sigmoid function changes a score into a probability</title>
  <desc id="desc">An S-shaped curve rises from zero to one and crosses probability 0.5 when the score is zero.</desc>
  <rect width="900" height="330" rx="20" fill="#f8fafc"/>
  <text x="44" y="47" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">Sigmoid: change a score into a probability from 0 to 1</text>
  <g stroke="#64748b" stroke-width="3"><line x1="100" y1="260" x2="830" y2="260"/><line x1="170" y1="285" x2="170" y2="78"/></g>
  <g font-family="sans-serif" font-size="16" fill="#475569"><text x="840" y="266">score</text><text x="20" y="87">probability</text><text x="143" y="264">0</text><text x="143" y="160">0.5</text><text x="143" y="83">1</text><text x="442" y="282">0</text></g>
  <line x1="170" y1="156" x2="780" y2="156" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M190 252 C330 252 380 230 450 156 C520 82 570 60 790 60" fill="none" stroke="#7c3aed" stroke-width="7"/>
  <circle cx="450" cy="156" r="8" fill="#7c3aed"/><text x="470" y="143" font-family="sans-serif" font-size="18" font-weight="700" fill="#6d28d9">score 0 → probability 0.5</text>
  <text x="190" y="310" font-family="sans-serif" font-size="17" fill="#475569">very negative score: probably outside</text><text x="610" y="310" font-family="sans-serif" font-size="17" fill="#475569">very positive: probably inside</text>
</svg>
