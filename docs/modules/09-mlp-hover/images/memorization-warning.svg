<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">One success is not proof of generalization</title>
  <desc id="desc">A green clean hover result is contrasted with untested wind, noisy sensor, and different starting altitude conditions.</desc>
  <rect width="900" height="350" rx="20" fill="#f8fafc"/><text x="44" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">One clean hover is a beginning, not proof of a robust policy</text>
  <rect x="55" y="88" width="335" height="210" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="4"/><text x="222" y="125" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#166534">Tested once</text><line x1="95" y1="255" x2="350" y2="255" stroke="#64748b" stroke-width="6"/><rect x="180" y="164" width="84" height="40" rx="12" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/><line x1="222" y1="143" x2="222" y2="92" stroke="#16a34a" stroke-width="4" stroke-dasharray="7 6"/><text x="222" y="283" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#166534">level start, no wind, clean sensor</text>
  <rect x="510" y="88" width="335" height="210" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="677" y="125" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#9a3412">Still untested</text><text x="560" y="172" font-family="sans-serif" font-size="20" fill="#9a3412">• crosswind</text><text x="560" y="210" font-family="sans-serif" font-size="20" fill="#9a3412">• noisy altitude sensor</text><text x="560" y="248" font-family="sans-serif" font-size="20" fill="#9a3412">• different start height</text><text x="560" y="282" font-family="sans-serif" font-size="20" fill="#9a3412">• different mass or battery</text>
  <text x="450" y="327" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Generalization means testing unfamiliar conditions, not repeating one familiar one.</text>
</svg>
