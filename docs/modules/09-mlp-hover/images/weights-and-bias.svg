<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Weights and bias in one neuron</title>
  <desc id="desc">Altitude error and velocity enter a neuron through weighted connections. A bias is added before the activation gives an output.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="330" rx="20" fill="#f8fafc"/>
  <text x="44" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">A neuron combines inputs, weights, and a bias</text>
  <rect x="65" y="112" width="145" height="54" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="87" y="145" font-family="sans-serif" font-size="19" fill="#1e3a8a">altitude error</text>
  <rect x="65" y="218" width="145" height="54" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="97" y="251" font-family="sans-serif" font-size="19" fill="#1e3a8a">velocity</text>
  <line x1="210" y1="139" x2="397" y2="169" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/><line x1="210" y1="245" x2="397" y2="184" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="286" y="130" font-family="sans-serif" font-size="18" fill="#475569">weight 1</text><text x="288" y="248" font-family="sans-serif" font-size="18" fill="#475569">weight 2</text>
  <circle cx="465" cy="176" r="67" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="424" y="170" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">neuron</text><text x="410" y="195" font-family="sans-serif" font-size="16" fill="#166534">weighted sum</text>
  <line x1="465" y1="98" x2="465" y2="108" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow)"/><text x="480" y="100" font-family="sans-serif" font-size="18" fill="#6d28d9">bias</text>
  <line x1="534" y1="176" x2="713" y2="176" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="730" y="142" width="125" height="67" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="755" y="170" font-family="sans-serif" font-size="18" fill="#9a3412">activation</text><text x="751" y="194" font-family="sans-serif" font-size="16" fill="#9a3412">and output</text>
</svg>
