<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">The simple MLP training loop</title>
  <desc id="desc">Generated flight states go to a PD teacher and an MLP. Their outputs create an error that updates MLP weights before repeating.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="280" rx="20" fill="#f8fafc"/>
  <text x="44" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">Training: compare a prediction with a teacher, then improve weights</text>
  <g font-family="sans-serif" text-anchor="middle"><rect x="45" y="120" width="135" height="64" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="112" y="147" font-size="17" fill="#1e3a8a">generated</text><text x="112" y="170" font-size="17" fill="#1e3a8a">states</text><rect x="270" y="90" width="145" height="64" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="342" y="117" font-size="17" fill="#166534">PD teacher</text><text x="342" y="140" font-size="15" fill="#166534">correct acceleration</text><rect x="270" y="190" width="145" height="64" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="342" y="217" font-size="17" fill="#9a3412">NumPy MLP</text><text x="342" y="240" font-size="15" fill="#9a3412">predicted acceleration</text><rect x="535" y="120" width="135" height="64" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/><text x="602" y="147" font-size="17" fill="#6d28d9">MSE error</text><text x="602" y="170" font-size="15" fill="#6d28d9">how wrong?</text><rect x="755" y="120" width="105" height="64" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="807" y="147" font-size="17" fill="#991b1b">update</text><text x="807" y="170" font-size="17" fill="#991b1b">weights</text></g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"><line x1="180" y1="139" x2="265" y2="121"/><line x1="180" y1="165" x2="265" y2="223"/><line x1="415" y1="122" x2="530" y2="139"/><line x1="415" y1="222" x2="530" y2="165"/><line x1="670" y1="152" x2="750" y2="152"/></g>
</svg>
