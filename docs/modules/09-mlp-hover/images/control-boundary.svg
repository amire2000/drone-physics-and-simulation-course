<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">The learned controller has a small responsibility</title>
  <desc id="desc">An MLP selects desired vertical acceleration while deterministic software converts that request through thrust, motors, attitude control, and PyBullet physics.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="300" rx="20" fill="#f8fafc"/><text x="44" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">The MLP makes one high-level choice; proven physics does the rest</text>
  <rect x="45" y="116" width="150" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="120" y="145" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1e3a8a">altitude error</text><text x="120" y="169" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1e3a8a">vertical velocity</text>
  <rect x="295" y="102" width="145" height="98" rx="16" fill="#f3e8ff" stroke="#7c3aed" stroke-width="4"/><text x="367" y="140" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#6d28d9">NumPy MLP</text><text x="367" y="169" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6d28d9">learned part ends here</text>
  <rect x="540" y="116" width="140" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="610" y="145" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#166534">acceleration</text><text x="610" y="169" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#166534">to thrust</text>
  <rect x="760" y="102" width="105" height="98" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="812" y="132" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9a3412">attitude PID</text><text x="812" y="155" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9a3412">motors</text><text x="812" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9a3412">PyBullet</text>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"><line x1="195" y1="151" x2="290" y2="151"/><line x1="440" y1="151" x2="535" y2="151"/><line x1="680" y1="151" x2="755" y2="151"/></g>
</svg>
