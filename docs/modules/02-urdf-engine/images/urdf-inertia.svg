<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Drone mass distribution and inertia</title><desc id="desc">A central body and four motor masses are positioned around a center of mass. Their distance from the center increases rotational inertia.</desc>
  <rect width="760" height="380" rx="18" fill="#f8fafc"/><text x="35" y="45" font-family="sans-serif" font-size="24" font-weight="700" fill="#1e293b">Mass farther from the center increases inertia</text>
  <g transform="translate(375 205)"><path d="M-145 0H145M0-145V145" stroke="#64748b" stroke-width="15" stroke-linecap="round"/><rect x="-55" y="-55" width="110" height="110" rx="13" fill="#1e3a5f"/><circle cx="-125" cy="-125" r="28" fill="#0ea5e9"/><circle cx="125" cy="-125" r="28" fill="#0ea5e9"/><circle cx="-125" cy="125" r="28" fill="#0ea5e9"/><circle cx="125" cy="125" r="28" fill="#0ea5e9"/><circle r="12" fill="#f59e0b"/><text x="17" y="-14" font-family="sans-serif" font-size="18" fill="#92400e">center of mass</text></g>
  <g font-family="sans-serif" font-size="18" fill="#334155"><text x="48" y="110">central body mass</text><text x="545" y="110">motor masses</text><text x="495" y="340">Ixx, Iyy, Izz measure resistance to rotation</text></g>
</svg>
