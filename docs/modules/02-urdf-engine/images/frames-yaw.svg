<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">World and body frames with yaw</title><desc id="desc">Top view of a drone rotated ninety degrees. World X and Y axes stay fixed while body forward rotates with the drone.</desc>
  <rect width="760" height="380" rx="18" fill="#f8fafc"/><text x="35" y="45" font-family="sans-serif" font-size="24" font-weight="700" fill="#1e293b">World frame stays fixed; body frame rotates with the drone</text>
  <g transform="translate(220 220)"><path d="M0 0H190M0 0V-140" stroke="#64748b" stroke-width="5"/><text x="198" y="7" font-family="sans-serif" font-size="18" fill="#475569">world +X</text><text x="-12" y="-150" font-family="sans-serif" font-size="18" fill="#475569">world +Y</text><circle r="9" fill="#64748b"/></g>
  <g transform="translate(220 220) rotate(-90)"><path d="M-22-78H22L43-30H-43Z" fill="#1e3a5f" stroke="#0f172a" stroke-width="4"/><path d="M0 0V-108" stroke="#16a34a" stroke-width="7"/><path d="M-14-91 0-112 14-91" fill="#16a34a"/><text x="18" y="-100" transform="rotate(90 18 -100)" font-family="sans-serif" font-size="17" fill="#166534">body +X forward</text></g>
  <path d="M350 215 A130 130 0 0 0 240 92" fill="none" stroke="#7c3aed" stroke-width="5" stroke-dasharray="8 6"/><text x="350" y="140" font-family="sans-serif" font-size="20" fill="#6d28d9">yaw ψ = 90°</text>
  <rect x="490" y="105" width="230" height="180" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="515" y="145" font-family="sans-serif" font-size="19" font-weight="700" fill="#075985">Transform</text><text x="515" y="180" font-family="monospace" font-size="17" fill="#0c4a6e">body forward = (1, 0)</text><text x="515" y="210" font-family="monospace" font-size="17" fill="#0c4a6e">at yaw 90° →</text><text x="515" y="240" font-family="monospace" font-size="17" fill="#0c4a6e">world = (0, 1)</text>
</svg>
