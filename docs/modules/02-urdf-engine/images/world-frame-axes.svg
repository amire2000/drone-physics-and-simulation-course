<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">World-frame positive X, Y, and Z axes</title>
  <desc id="desc">A world origin with positive X shown in red, positive Y in green, and positive Z in blue. A drone is positioned away from that fixed origin.</desc>
  <defs>
    <marker id="red-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#dc2626"/></marker>
    <marker id="green-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#16a34a"/></marker>
    <marker id="blue-arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#2563eb"/></marker>
  </defs>
  <rect width="760" height="400" rx="18" fill="#f8fafc"/>
  <text x="36" y="48" font-family="sans-serif" font-size="25" font-weight="700" fill="#1e293b">The fixed world frame</text>
  <text x="36" y="78" font-family="sans-serif" font-size="17" fill="#475569">The axes stay at the world origin even when the drone moves or rotates.</text>
  <g transform="translate(230 270)" stroke-linecap="round">
    <circle r="12" fill="#0f172a"/>
    <path d="M0 0H185" stroke="#dc2626" stroke-width="8" marker-end="url(#red-arrow)"/>
    <path d="M0 0L-120 70" stroke="#16a34a" stroke-width="8" marker-end="url(#green-arrow)"/>
    <path d="M0 0V-160" stroke="#2563eb" stroke-width="8" marker-end="url(#blue-arrow)"/>
    <text x="195" y="8" font-family="sans-serif" font-size="21" font-weight="700" fill="#b91c1c">+X</text>
    <text x="-160" y="90" font-family="sans-serif" font-size="21" font-weight="700" fill="#15803d">+Y</text>
    <text x="14" y="-148" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d4ed8">+Z</text>
    <text x="-58" y="30" font-family="sans-serif" font-size="17" fill="#334155">world origin</text>
  </g>
  <g transform="translate(470 145)">
    <rect width="245" height="165" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="20" y="35" font-family="sans-serif" font-size="20" font-weight="700" fill="#1e293b">Positive world axes</text>
    <g font-family="sans-serif" font-size="17" fill="#334155">
      <text x="20" y="75"><tspan font-weight="700" fill="#b91c1c">Red +X:</tspan> east / right</text>
      <text x="20" y="110"><tspan font-weight="700" fill="#15803d">Green +Y:</tspan> north / forward</text>
      <text x="20" y="145"><tspan font-weight="700" fill="#1d4ed8">Blue +Z:</tspan> up</text>
    </g>
  </g>
</svg>
