<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc">
  <title id="title">Force through center of mass versus off-center force</title><desc id="desc">A force through the center of mass translates a drone. The same force at a motor has a lever arm and rotates it.</desc>
  <rect width="760" height="380" rx="18" fill="#f8fafc"/><text x="35" y="45" font-family="sans-serif" font-size="24" font-weight="700" fill="#1e293b">Force location decides translation or torque</text>
  <g transform="translate(180 210)"><path d="M-110 0H110M0-65V65" stroke="#334155" stroke-width="17" stroke-linecap="round"/><circle r="15" fill="#f59e0b"/><text x="-90" y="105" font-family="sans-serif" font-size="18" fill="#334155">center of mass</text><path d="M0-145V-85m-13-18 13-20 13 20" stroke="#16a34a" stroke-width="9" fill="none"/><text x="25" y="-120" font-family="sans-serif" font-size="18" fill="#166534">F</text><text x="-112" y="145" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">r = 0 → no torque</text></g>
  <line x1="380" y1="80" x2="380" y2="330" stroke="#cbd5e1" stroke-width="3"/>
  <g transform="translate(570 210)"><path d="M-110 0H110M0-65V65" stroke="#334155" stroke-width="17" stroke-linecap="round"/><circle r="15" fill="#f59e0b"/><circle cx="95" cy="0" r="14" fill="#0ea5e9"/><path d="M95-145V-35m-13-18 13-20 13 20" stroke="#16a34a" stroke-width="9" fill="none"/><path d="M0 27H95" stroke="#7c3aed" stroke-width="5" stroke-dasharray="8 6"/><text x="40" y="50" font-family="sans-serif" font-size="18" fill="#6d28d9">lever arm r</text><path d="M-40-90 A90 90 0 0 1 55-65" fill="none" stroke="#dc2626" stroke-width="7"/><text x="-80" y="-90" font-family="sans-serif" font-size="18" fill="#991b1b">τ = r × F</text><text x="-115" y="145" font-family="sans-serif" font-size="18" font-weight="700" fill="#991b1b">r ≠ 0 → rotation</text></g>
</svg>
