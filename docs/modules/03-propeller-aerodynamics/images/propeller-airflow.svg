<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Propeller airflow and thrust</title>
  <desc id="desc">A rotor pushes air downward and the reaction force pushes the drone upward.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="420" rx="18" fill="#f8fafc"/>
  <text x="450" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1e293b">A propeller changes air momentum</text>
  <rect x="280" y="170" width="340" height="70" rx="18" fill="#1e3a5f"/>
  <circle cx="330" cy="205" r="18" fill="#f59e0b"/><circle cx="570" cy="205" r="18" fill="#f59e0b"/>
  <text x="450" y="213" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">drone body</text>
  <line x1="450" y1="165" x2="450" y2="72" stroke="#16a34a" stroke-width="12" marker-end="url(#arrow-green)"/>
  <text x="470" y="105" font-family="sans-serif" font-size="22" fill="#15803d">thrust on drone, T</text>
  <line x1="450" y1="245" x2="450" y2="365" stroke="#2563eb" stroke-width="12" marker-end="url(#arrow-blue)"/>
  <text x="470" y="330" font-family="sans-serif" font-size="22" fill="#1d4ed8">air accelerated downward</text>
  <path d="M360 135 C390 105 510 105 540 135" fill="none" stroke="#f59e0b" stroke-width="7" stroke-dasharray="14 10"/>
  <text x="450" y="100" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#92400e">spinning rotor disk</text>
  <text x="450" y="398" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">The air receives downward momentum; the drone receives an upward reaction force.</text>
</svg>
