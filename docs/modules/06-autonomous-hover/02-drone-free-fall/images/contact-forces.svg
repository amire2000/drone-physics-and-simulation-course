<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Forces before and during ground contact</title>
  <desc id="desc">A blue drone falls with only a red downward gravity arrow. After touching the ground, a green upward normal-force arrow appears and can be larger than weight during impact.</desc>
  <defs>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="900" height="390" rx="20" fill="#f8fafc"/>
  <text x="44" y="48" font-family="sans-serif" font-size="27" font-weight="700" fill="#1e293b">Ground contact adds an upward force</text>
  <line x1="450" y1="76" x2="450" y2="352" stroke="#cbd5e1" stroke-width="3"/>
  <text x="135" y="98" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Before contact: free fall</text>
  <text x="558" y="98" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">During contact: collision</text>
  <line x1="65" y1="330" x2="395" y2="330" stroke="#64748b" stroke-width="8"/>
  <rect x="186" y="166" width="88" height="50" rx="13" fill="#38bdf8" stroke="#0369a1" stroke-width="4"/>
  <line x1="230" y1="216" x2="230" y2="284" stroke="#dc2626" stroke-width="7" marker-end="url(#red-arrow)"/>
  <text x="246" y="264" font-family="sans-serif" font-size="21" font-weight="700" fill="#b91c1c">weight mg</text>
  <text x="128" y="367" font-family="sans-serif" font-size="18" fill="#475569">N = 0, so Fz = −mg and az = −g</text>
  <line x1="505" y1="330" x2="835" y2="330" stroke="#64748b" stroke-width="8"/>
  <rect x="620" y="276" width="100" height="50" rx="13" fill="#38bdf8" stroke="#0369a1" stroke-width="4"/>
  <line x1="670" y1="276" x2="670" y2="178" stroke="#16a34a" stroke-width="8" marker-end="url(#green-arrow)"/>
  <line x1="695" y1="326" x2="695" y2="365" stroke="#dc2626" stroke-width="7" marker-end="url(#red-arrow)"/>
  <text x="688" y="168" font-family="sans-serif" font-size="21" font-weight="700" fill="#15803d">normal force N</text>
  <text x="710" y="377" font-family="sans-serif" font-size="20" font-weight="700" fill="#b91c1c">mg</text>
  <text x="515" y="238" font-family="sans-serif" font-size="18" fill="#475569">During impact, N can be greater than mg.</text>
  <text x="524" y="367" font-family="sans-serif" font-size="18" fill="#475569">Fz = N − mg = maz</text>
</svg>
