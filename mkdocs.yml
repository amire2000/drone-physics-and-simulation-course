site_name: Drone Physics & Simulation
site_description: Build a quadcopter physics engine from first principles
theme:
  name: material
  favicon: assets/drone-icon.svg
  features:
    - content.code.copy
extra_javascript:
  - javascripts/quiz.js
  - javascripts/mermaid.mjs
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/quiz.css
  - stylesheets/mermaid.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Syllabus: syllabus.md
  - "Module 0: PyBullet setup": modules/00-pybullet-setup/index.md
  - "Module 1: Mass and forces":
      - Overview: modules/01-mass-and-forces/index.md
      - "Experiment 1: Free fall": modules/01-mass-and-forces/01-free-fall/index.md
      - "Experiment 2: Track linear velocity": modules/01-mass-and-forces/02-track-linear-velocity/index.md
      - "Experiment 3: Force and hover": modules/01-mass-and-forces/03-hover-force/index.md
  - "Module 2: URDF engine":
      - Overview: modules/02-urdf-engine/index.md
      - URDF anatomy: modules/02-urdf-engine/urdf-anatomy/index.md
      - Real racing-quad case study: modules/02-urdf-engine/real-drone/index.md
      - Define a complete quadcopter: modules/02-urdf-engine/drone-definition/index.md
  - "Module 3: Propeller aerodynamics":
      - Overview: modules/03-propeller-aerodynamics/index.md
      - Motor KV: modules/03-propeller-aerodynamics/motor-kv/index.md
      - Propeller geometry and airflow: modules/03-propeller-aerodynamics/propeller-design/index.md
      - Configuration takeoff comparison: modules/03-propeller-aerodynamics/configuration-comparison/index.md
  - "Module 4: Motor mixer and PID": modules/04-motor-mixer-pid/index.md
