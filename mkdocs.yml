site_name: Drone Physics & Simulation
site_description: Build a quadcopter physics engine from first principles
theme:
  name: material
  favicon: assets/drone-icon.svg
  features:
    - content.code.copy
extra_javascript:
  - javascripts/quiz.js
  - javascripts/mermaid.mjs
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/quiz.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Syllabus: syllabus.md
  - "Module 0: PyBullet setup": modules/00-pybullet-setup/index.md
  - "Module 1: Mass and forces": modules/01-mass-and-forces/index.md
  - "Module 2: URDF engine":
      - Overview: modules/02-urdf-engine/index.md
      - URDF anatomy: modules/02-urdf-engine/urdf-anatomy/index.md
      - Real racing-quad case study: modules/02-urdf-engine/real-drone/index.md
  - "Module 3: Propeller aerodynamics":
      - Overview: modules/03-propeller-aerodynamics/index.md
      - Motor KV: modules/03-propeller-aerodynamics/motor-kv/index.md
      - Propeller geometry and airflow: modules/03-propeller-aerodynamics/propeller-design/index.md
      - Configuration takeoff comparison: modules/03-propeller-aerodynamics/configuration-comparison/index.md
  - "Module 4: Motor mixer and PID": modules/04-motor-mixer-pid/index.md
  - "Module 5: Battery voltage sag": modules/05-battery-voltage-sag/index.md
  - "Module 6: Autonomous hover":
      - Overview: modules/06-autonomous-hover/index.md
      - "Step 1: Initialize environment": modules/06-autonomous-hover/01-initialize-environment/index.md
      - "Step 2: Drone free fall": modules/06-autonomous-hover/02-drone-free-fall/index.md
      - "Step 5: Physics-engine validation": modules/06-autonomous-hover/05-physics-engine-validation/index.md
  - "Module 7: Optical navigation": modules/07-optical-navigation/index.md
  - "Module 8: Betaflight SITL bridge": modules/08-betaflight-sitl/index.md
  - "Module 9: Learned vertical hover":
      - Overview: modules/09-mlp-hover/index.md
      - "Lesson 1: NumPy MLP from scratch": modules/09-mlp-hover/01-numpy-mlp-basics/index.md
      - "Lesson 2: MLP drone decision": modules/09-mlp-hover/01-mlp-introduction/index.md
      - "Lesson 3: Vertical acceleration practice": modules/09-mlp-hover/02-vertical-acceleration-practice/index.md
      - "Lesson 4: Read the PyBullet MLP hover code": modules/09-mlp-hover/03-pybullet-mlp-code/index.md
