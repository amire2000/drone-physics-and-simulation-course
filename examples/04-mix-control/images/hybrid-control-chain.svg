<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="190" viewBox="0 0 1120 190" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid PID outer and ADRC inner control chain</title>
  <desc id="desc">The hybrid controller uses PID for position and velocity, ADRC for attitude and rate, followed by mixing and the drone.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#17202a} .box{stroke:#24527a;stroke-width:2;rx:10} .pid{fill:#dceeff} .adrc{fill:#ffe3c2;stroke:#7b3f00} .io{fill:#fff3cd} .arrow{stroke:#34495e;stroke-width:2;marker-end:url(#a)} .label{font-size:14px;font-weight:bold} .small{font-size:12px}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker></defs>
  <rect class="box io" x="20" y="65" width="140" height="60"/><text class="label" x="90" y="91" text-anchor="middle">Target position</text><text class="small" x="90" y="110" text-anchor="middle">home-relative XYZ</text>
  <rect class="box pid" x="195" y="65" width="145" height="60"/><text class="label" x="267" y="91" text-anchor="middle">PID position</text><text class="small" x="267" y="110" text-anchor="middle">desired velocity</text>
  <rect class="box pid" x="375" y="65" width="145" height="60"/><text class="label" x="447" y="91" text-anchor="middle">PID velocity</text><text class="small" x="447" y="110" text-anchor="middle">desired acceleration</text>
  <rect class="box adrc" x="555" y="65" width="145" height="60"/><text class="label" x="627" y="91" text-anchor="middle">ADRC attitude/rate</text><text class="small" x="627" y="110" text-anchor="middle">ESO → torque</text>
  <rect class="box" fill="#e8f8f5" x="735" y="65" width="125" height="60"/><text class="label" x="797" y="91" text-anchor="middle">Mixer</text><text class="small" x="797" y="110" text-anchor="middle">four motors</text>
  <rect class="box io" x="895" y="65" width="190" height="60"/><text class="label" x="990" y="91" text-anchor="middle">PyBullet drone</text><text class="small" x="990" y="110" text-anchor="middle">position, attitude, rates</text>
  <path class="arrow" d="M160 95h35M340 95h35M520 95h35M700 95h35M860 95h35"/>
  <path class="arrow" d="M990 145V170H267V125" fill="none"/><text class="small" x="630" y="185" text-anchor="middle">PID outer feedback + ADRC inner feedback</text>
</svg>
