# 40 m diagonal-strike test. The drone starts at x=-20 m and the box at x=20 m.
simulation:
  scene:
    launch_position: [-20.0, 0.0, 0.05]  # Initial world position in metres.
    target_center: [20.0, 0.0, 1.0]      # Red cube center in world coordinates.
    target_size_m: 2.0                   # Static cube edge length.

runtime:
  physical_setup:
    camera:
      camera_width_px: 640       # Camera image width.
      camera_height_px: 480      # Camera image height.
      camera_hz: 30              # Camera sampling rate.
      camera_fov_deg: 90.0       # Camera horizontal field of view.
      camera_look_down_deg: 0.0  # Physical camera mounting angle.
  mission:
    takeoff_altitude_m: 15.0     # Height where visual tracking begins.
    impact_altitude_m: 1.0       # Desired altitude at contact.
    forward_speed_mps: 13.0      # Desired forward velocity.
    nominal_pitch_deg: 20.0      # Initial forward pitch request.
  ttc:
    # A small distant bbox should enter commit before leaving the camera view.
    commit_box_height_fraction: 0.04
