# Copy this file to create a scenario. Omitted values use dataclass defaults.
simulation:
  scene:
    launch_position: [-10.0, 0.0, 0.05]  # Initial world position [m].
    target_center: [20.0, 0.0, 1.0]      # Target center [m].
    target_size_m: 2.0                   # Target cube edge length [m].
  vehicle_model:
    profile: default                      # Shared vehicle profile; linked URDF owns mass/inertia.
    gravity_mps2: 9.81                   # Simulator gravity [m/s²].
  physical_forces:
    body_drag:
      enabled: true                       # Quadratic frame drag switch.
      air_density_kg_m3: 1.225            # Air density [kg/m³].
      cd_area_m2: [0.012, 0.012, 0.020]  # Effective CdA in body x/y/z [m²].
    angular_damping:
      enabled: true                       # Aerodynamic attitude-rate damping switch.
      coefficients_nm_per_rad_s: [0.0012, 0.0012, 0.0020]  # Roll/pitch/yaw damping.
    wind:
      enabled: true                       # Use the constant world-frame air velocity.
      world_velocity_mps: [0.0, 0.0, 0.0]  # Wind velocity in world x/y/z [m/s].
    rotor_aerodynamics:
      enabled: false                      # Optional inflow and blade-flapping model.
      propeller_diameter_m: 0.127         # Override the 5-inch course profile diameter [m].
      inflow_coefficient: 0.35            # Forward-flight thrust-loss scale.
      blade_flapping_coefficient: 0.10    # In-plane rotor force scale.
    ground_effect:
      enabled: false                      # Optional near-surface lift increase.
      ground_effect_height_m: 0.35        # Search depth below each rotor [m].
      ground_effect_coefficient: 0.10     # Ground-effect strength.
      ground_effect_max_multiplier: 1.25  # Maximum rotor thrust multiplier.
    gyroscopic:
      enabled: false                      # Optional rotor angular-momentum torque.
      rotor_inertia_kg_m2: 0.000005       # One rotor's polar inertia [kg·m²].
  sensor_model:
    random_seed: 7                       # Reproducible sensor noise seed.
  display:
    environment_size_px: [960, 540]      # Wide environment render size.
    opencv_window_position_px: [20, 80]  # Camera window screen position.
    plot_window_position_px: [700, 80]   # Matplotlib window screen position.
  recording:
    post_impact_seconds: 3.0             # Simulation time after collision.

runtime:
  physical_setup:
    camera:
      camera_width_px: 640               # Camera image width [px].
      camera_height_px: 480              # Camera image height [px].
      camera_hz: 30                      # Camera sampling rate [Hz].
      camera_fov_deg: 90.0               # Horizontal field of view [deg].
      camera_look_down_deg: 0.0          # Camera mount angle [deg].
  mission:
    takeoff_altitude_m: 15.0             # Height where tracking starts [m].
    impact_altitude_m: 1.0               # Desired contact altitude [m].
    forward_speed_mps: 13.0              # Desired forward velocity [m/s].
    nominal_pitch_deg: 20.0              # Initial pitch request [deg].
  flight_limits:
    max_descent_velocity_mps: 4.5        # Maximum descent rate [m/s].
    max_climb_velocity_mps: 3.0          # Maximum climb rate [m/s].
    max_pitch_deg: 20.0                  # Maximum requested pitch [deg].
    takeoff_altitude_tolerance_m: 0.2    # Takeoff altitude ready band [m].
    takeoff_velocity_tolerance_mps: 0.5  # Takeoff stability band [m/s].
    commit_timeout_margin_s: 5.0         # Extra commit deadline margin [s].
  ttc:
    min_ttc_s: 0.2                       # Minimum accepted TTC [s].
    commit_box_height_fraction: 0.04     # Bbox height fraction to arm commit.
    alpha: 0.85                          # Trust in the latest bbox-scale measurement [0..1].
    beta: 0.05                           # Trust in bbox-scale-rate correction [0..1].
    min_growth_px_per_s: 0.01            # Minimum approach growth [px/s].
  sensors:
    barometer:
      sample_hz: 40.0                     # BMP388 altitude update rate [Hz], separate from the camera.
      altitude_noise_sigma_m: 0.10        # Full-bandwidth BMP388 altitude RMS noise [m].
      altitude_bias_m: 0.0                # Fixed calibration/reference offset [m].
      drift_sigma_m_per_sqrt_s: 0.0       # Optional slow random-walk field drift [m/sqrt(s)].
      altitude_old_weight: 0.80           # Previous filtered altitude weight [0..1].
      velocity_old_weight: 0.95           # Smooth noisy differentiated altitude into vertical speed [0..1].
  pid:
    altitude:
      gains: [0.7, 0.05, 1.1]            # [kp, ki, kd].
      integral_limit: 0.5                # Altitude integral clamp.
    forward_speed:
      gains: [0.03, 0.0, 0.002]          # [kp, ki, kd].
      integral_limit: 0.2                # Pitch integral clamp.
    pitch_attitude:
      gains: [0.008, 0.0, 0.006]         # [kp, ki, kd].
    vertical_velocity:
      gains: [1.0, 0.0, 0.0]             # [kp, ki, kd].
  vertical_control:
    vertical_position_correction: 0.8     # Position error to velocity correction.
